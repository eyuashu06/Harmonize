[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonyhub-api"
version = "0.1.0"
description = "HarmonyHub backend API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HarmonyHub Team" }]

dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "SQLAlchemy==2.0.35",
  "alembic==1.13.3",
  "psycopg[binary]==3.2.3",
  "redis==5.0.8",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "python-multipart==0.0.12",
  "email-validator==2.2.0",
  "structlog==24.4.0",
  "python-dotenv==1.0.1",
  "tenacity==9.0.0",
  "numpy==1.26.4",
]

[project.optional-dependencies]
auth = [
  "firebase-admin==6.5.0",
]

audio = [
  "librosa==0.10.2",
  "basic-pitch==0.3.2",
  "music21==9.1.0",
  "pretty-midi==0.2.10",
  "essentia==2.1b6.dev1034",
  "demucs==4.0.1",
  "torch==2.4.0",
  "scipy==1.14.0",
  "soundfile==0.12.1",
]

dev = [
  "httpx==0.27.2",
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "pytest-cov==5.0.0",
  "ruff==0.6.8",
  "mypy==1.11.2",
  "factory-boy==3.3.1",
  "faker==30.0.0",
  "freezegun==1.5.1",
  "types-passlib==1.7.7.20240819",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "PT", "RET", "SIM", "PTH", "PL"]
ignore = ["E501", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]
"alembic/*" = ["E", "F"]
# FastAPI's documented idiom is declaring Query()/File()/Form() defaults.
"app/**/router.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
